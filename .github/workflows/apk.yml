name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'fonts/**', 'icons/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASS secrets (Settings > Secrets and variables > Actions), then re-run."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html fonts icons android/app/src/main/assets/www/

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mona-journal.apk
          gh release create "v1.0.${{ github.run_number }}" mona-journal.apk \
            --title "ژورنال مونا ۱.۰.${{ github.run_number }}" \
            --notes "برای نصب، فایل mona-journal.apk را روی گوشی دانلود و باز کن." --latest
