<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ژورنال روزانه مونا</title>
<meta name="description" content="ژورنال روزانه: حال، خواب، برنامه و عادت‌ها">
<meta name="theme-color" content="#f7f3ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140f24" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ژورنال مونا">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:Vazirmatn;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/vazirmatn-arabic-wght-normal.woff2) format("woff2-variations");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC,U+102E0-102FB,U+10E60-10E7E,U+10EC2-10EC4,U+10EFC-10EFF,U+1EE00-1EEFF}
@font-face{font-family:Vazirmatn;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/vazirmatn-latin-wght-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{color-scheme:light dark;
--bg:#f7f3ff;--card:#fff;--ink:#2b1d4f;--soft:#6e6390;--line:#ebe3fb;--chip:#f2ecff;--sel:#7c3aed;--selInk:#fff;--acc:#8b5cf6;--acc2:#ec4899;
--m5:#2bb673;--m4:#9ccc3d;--m3:#46a4f1;--m2:#ffa23e;--m1:#ff5a7a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#140f24;--card:#1f1834;--ink:#f1ebff;--soft:#b5a9d8;--line:#30274f;--chip:#2a2146;--sel:#a78bfa;--selInk:#1a1030}}
:root[data-theme=dark]{--bg:#140f24;--card:#1f1834;--ink:#f1ebff;--soft:#b5a9d8;--line:#30274f;--chip:#2a2146;--sel:#a78bfa;--selInk:#1a1030}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Vazirmatn,Tahoma,sans-serif;overflow-x:clip;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--m3);outline-offset:2px;border-radius:8px}
.wrap{max-width:680px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
h1{font-size:clamp(24px,5vw,30px);line-height:1.15;margin:4px 0 12px;font-weight:900;color:var(--sel)}
h2{font-size:17px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2 small{font-size:13px;color:var(--soft);font-weight:500}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px -6px #7c3aed33}
.quote{font-weight:900;font-size:19px;line-height:1.7;margin:0;text-wrap:balance}
.qcard{background:linear-gradient(135deg,#8b5cf6,#d946ef 60%,#f472b6);color:#fff;box-shadow:0 10px 24px -14px #a21caf}
.quote small{display:block;color:var(--soft);font-weight:400;font-size:13px}
.lab{color:var(--soft);font-size:13px;margin:12px 0 4px}
.q{font-weight:800;font-size:15px;margin:14px 0 6px;color:var(--ink)}
.q:first-of-type{margin-top:4px}
.field{width:100%;border:1px solid var(--line);background:transparent;border-radius:12px;padding:8px 12px;font-size:16px;min-height:44px}
textarea.field{resize:vertical;min-height:72px}
.task{display:flex;gap:8px;align-items:center;margin-top:6px}
.task input[type=checkbox]{width:24px;height:24px;accent-color:var(--sel);flex:none;margin:0}
.task.done .field{text-decoration:line-through;color:var(--soft)}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:34px;height:42px;border:2px solid #0ea5e9;border-radius:4px 4px 11px 11px;background:none;position:relative;overflow:hidden;padding:0}
.cup::after{content:"";position:absolute;inset:auto 0 0;height:0;background:#0ea5e9;opacity:.8;transition:height .25s}
.cup.on::after{height:80%}
.cup.warm{border-color:#f59e0b;width:40px;border-radius:6px 6px 14px 14px;display:grid;place-items:center}
.cup.warm::after{background:#f59e0b;opacity:.55}
.cup.warm span{position:relative;z-index:1;font-size:16px;opacity:.5}.cup.warm.on span{opacity:1}
.cupsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.num{width:24px;text-align:center;color:var(--acc2);font-weight:900;flex:none}
.inf{font-style:normal;color:var(--acc);font-size:13px;opacity:.8}
.notebox{background:var(--chip);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;white-space:pre-wrap;line-height:1.8;border-inline-start:4px solid var(--acc)}
.mini{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;text-align:start;font-size:15px;padding:10px 16px;border-inline-start:4px solid var(--acc)}
.mini .mi{display:flex;align-items:center;gap:6px}
.mini .ed{color:var(--soft);font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daynav .c{text-align:center}.daynav b{display:block;font-size:20px;line-height:1.3}.daynav small{color:var(--soft);font-size:13px}
.rnd{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;flex:none}
.rnd:disabled{opacity:.35}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:12px;background:var(--chip);border-radius:9px;overflow:hidden}
.prog .bar span{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899);border-radius:9px;transition:width .3s}
.prog b{font-size:20px;white-space:nowrap}
.tl{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:52px 30px minmax(0,1fr) 30px;gap:8px;align-items:center;padding:9px 10px;border-radius:14px;margin-bottom:6px;background:color-mix(in srgb,var(--c) 9%,var(--card));border-inline-start:4px solid var(--c)}
.it .tm{font-weight:800;font-size:14px;white-space:nowrap;color:var(--c)}
.it .em{font-size:22px;line-height:1;text-align:center}
.it .lb{border:0;background:none;text-align:start;padding:2px 0;font-size:15px;line-height:1.45}
.it .lb small{display:block;color:var(--soft);font-size:12px}
.it.done .lb{text-decoration:line-through;color:var(--soft)}
.it.now{box-shadow:0 0 0 2px var(--c)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:none;display:grid;place-items:center;color:#fff;font-size:16px;padding:0}
.ck.on{background:var(--c)}
.addrow{width:100%;border:2px dashed var(--line);background:none;border-radius:14px;min-height:46px;color:var(--soft);margin-top:4px}
.cat{margin-top:14px}.cat:first-of-type{margin-top:0}
.cat h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px;color:var(--c)}
.cat h3 small{color:var(--soft);font-weight:500;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hab{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:var(--card);border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px;display:flex;align-items:center;gap:6px}
.hab.on{background:var(--c);border-color:var(--c);color:#fff}
.hab .del{background:#0003;color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px}
.inline{display:flex;gap:6px;margin-top:8px}.inline .field{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;min-height:44px}
.btn.sm{min-height:36px;font-size:14px}
.btn.full{width:100%}
.day{margin:18px 0 8px;font-weight:800;font-size:15px;color:var(--soft)}
.entry{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px;border:0;width:100%;text-align:start}
.entry .mt{font-weight:800}.entry .mt span{color:var(--soft);font-weight:400;font-size:13px;margin-inline-start:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:12px;background:var(--chip);border-radius:999px;padding:2px 9px}
.note{margin:6px 0 0;font-size:14px;color:var(--soft);white-space:pre-wrap}
.empty{text-align:center;color:var(--soft);padding:24px 12px}
nav{position:fixed;inset:auto 0 0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:none;padding:4px 2px;font-size:12px;color:var(--soft);min-height:52px;border-radius:12px;display:grid;justify-items:center;line-height:1.3}
nav button span{font-size:20px}
nav button[aria-pressed=true]{color:var(--sel);font-weight:800;background:var(--chip)}
nav .add{position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 20px -6px #a21caf99;border:0;min-height:0;display:block;padding:0}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;overscroll-behavior:contain}
.sheet .wrap{padding-bottom:120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--chip);width:44px;height:44px;border-radius:50%;font-size:20px;flex:none}
/* emoji faces */
.fe{display:grid;place-items:center;border-radius:50%;line-height:1;flex:none}
.fe svg{display:block}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:6px 0 4px}
.mood{border:0;background:none;display:grid;justify-items:center;gap:4px;padding:6px 0;border-radius:14px;font-size:13px;color:var(--soft)}
.mood .fe{width:min(52px,13.5vw);height:min(52px,13.5vw);transition:transform .15s,filter .15s,opacity .15s}
.mood.on .fe{filter:none;opacity:1;transform:scale(1.16);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--sel)}
.mood.on{font-weight:800;color:var(--ink)}
.moods.picked .mood:not(.on) .fe{opacity:.35;filter:grayscale(.6)}
.grp{margin-top:14px}.grp h3{font-size:14px;margin:0 0 6px;color:var(--soft);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.act{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;min-height:40px;font-size:14px}
.act.on{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.act.neg.on{background:var(--m1);border-color:var(--m1);color:#fff}
.act.pos.on{background:var(--m5);border-color:var(--m5);color:#fff}
.save{position:fixed;inset:auto 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:11}
.save div{max-width:680px;margin:0 auto;display:flex;gap:8px}
.pri{flex:1;border:0;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;border-radius:14px;min-height:52px;font-weight:800}
.pri:disabled{opacity:.4}
.delb{border:1px solid var(--m1);color:var(--m1);background:none;border-radius:14px;padding:0 16px;min-height:52px}
.emo{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.emo button{border:0;background:var(--chip);border-radius:10px;width:40px;height:40px;font-size:20px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg label{flex:1;min-width:130px;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;font-size:14px;background:var(--card)}
.colors{display:flex;flex-wrap:wrap;gap:6px}.colors button{border:2px solid transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:#fff;min-height:38px}
.colors button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
/* check-in (sleep + morning mood) */
.checkin{border-top:4px solid var(--acc)}
.checkin hr{border:0;border-top:1px dashed var(--line);margin:16px 0 4px}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.times label{display:grid;gap:4px;font-size:13px;color:var(--soft)}
.times input{text-align:center;font-weight:700;color:var(--ink)}
.dur{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--chip);font-size:14px}
.dur b{font-size:16px}
.done-line{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px}
.install{display:flex;align-items:center;gap:10px;border:1px solid var(--line)}
.install p{flex:1;margin:0;font-size:14px}
/* habit grid */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 44px;gap:4px;align-items:center;font-size:13px}
.grid .h{color:var(--soft);text-align:center;font-size:12px;line-height:1.2}
.grid .h.t{color:var(--ink);font-weight:800}
.grid .n{grid-column:1/-1;font-size:14px;margin-top:6px}
.grid .g{grid-column:1/-1;font-weight:800;color:var(--c);margin-top:10px;font-size:14px}
.cell{width:28px;height:28px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);background:none;padding:0;justify-self:center;color:#fff;font-size:13px}
.cell.on{background:var(--c);border-color:var(--c)}
.cell:disabled{opacity:.3}
.cnt{text-align:left;font-weight:700;white-space:nowrap;font-size:13px}
.cnt.ok{color:var(--m5)}
/* stats */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal .wd{font-size:12px;color:var(--soft)}
.cal button{aspect-ratio:1;border:0;border-radius:50%;background:var(--chip);font-size:14px;padding:0;display:grid;place-items:center}
.cal button.t{box-shadow:inset 0 0 0 2px var(--ink)}
.cal button:disabled{opacity:.35}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mhead b{font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:13px;color:var(--soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:4px;vertical-align:-1px}
.fig{position:relative;height:200px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.hrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.2em;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.hbar{height:10px;background:var(--chip);border-radius:9px;overflow:hidden}.hbar span{display:block;height:100%;border-radius:9px}
.hrow b{text-align:left;font-weight:700;white-space:nowrap}
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.big div{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.card .big div{background:var(--chip)}
.big b{display:block;font-size:clamp(18px,5vw,24px);line-height:1.25}.big small{color:var(--soft);font-size:12px}
.sbars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;margin-top:22px;position:relative}
.sbars .col{display:grid;grid-template-rows:120px 14px;gap:4px;justify-items:center}
.sbars .b{width:100%;max-width:22px;align-self:end;border-radius:6px 6px 3px 3px;background:var(--chip)}
.sbars small{font-size:10px;color:var(--soft);line-height:1}
.sbars .goal{position:absolute;inset-inline:0;border-top:1.5px dashed var(--soft);opacity:.6}
.sbars .goal span{position:absolute;inset-inline-start:0;top:-16px;font-size:10px;color:var(--soft)}
.insight{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.bk{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.bk .t{flex:1;border:0;background:none;text-align:start;padding:2px 0;font-size:15px;line-height:1.45}
.bk .t small{display:block;color:var(--soft);font-size:12px}
.bk.done .t{text-decoration:line-through;color:var(--soft)}
.bk .go{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px;min-height:34px;flex:none}
.bk input[type=checkbox]{width:22px;height:22px;accent-color:var(--m5);flex:none;margin:0}
.sec{font-weight:800;font-size:15px;color:var(--soft);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px}
.quick button.on{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--sel);color:var(--selInk);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <section id="v-today"></section>
  <section id="v-feed" hidden></section>
  <section id="v-habits" hidden></section>
  <section id="v-stats" hidden></section>
  <section id="v-bucket" hidden></section>
</div>
<nav>
  <button data-v="today" aria-pressed="true"><span>📅</span>امروز</button>
  <button data-v="feed" aria-pressed="false"><span>📖</span>دفتر</button>
  <button data-v="bucket" aria-pressed="false"><span>🪣</span>باکت‌لیست</button>
  <button class="add" id="add" aria-label="ثبت حال الان">+</button>
  <button data-v="habits" aria-pressed="false"><span>✅</span>عادت‌ها</button>
  <button data-v="stats" aria-pressed="false"><span>📊</span>آمار</button>
</nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>

  uid=id;db=d;const to=setTimeout(()=>toast('اتصال کند است؛ داده‌های همین دستگاه نمایش داده می‌شود'),10000);
  const q=await db.collection('data/users/'+uid).limit(1000).get();clearTimeout(to);
  const seen=new Set();q.docs.forEach(x=>{seen.add(x.id);const v=x.data(),l=docs.get(x.id);if(!l||(v.updated||0)>=(l.updated||0))docs.set(x.id,v)});
  for(const[k,v]of docs)if(!seen.has(k))put(k,v);saveLocal();if(!sheet)refresh()}catch(e){}})();
}
</script>
